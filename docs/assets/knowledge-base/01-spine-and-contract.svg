<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="On the left, the folder layout the skill writes: originals gitignored, Markdown conversions tracked, a drop zone, a bibliography, the converter script, agent conventions, and a gitignore. On the right, the chain: a citation key in the manuscript looks up its bibliography entry, which matches by author and year to a tracked Markdown file, converted at intake from an original kept on local disk. If a link breaks, the citation cannot be checked.">
<style>@media (prefers-color-scheme: dark){[fill="#F3EFE3"]{fill:#14161C} [fill="#ECE6D6"]{fill:#1b1e26} [fill="#17171A"]{fill:#EFE8D7} [fill="#68686D"]{fill:#9b9ba3} [fill="#1F4E9B"]{fill:#5485E0} [fill="#8B5F10"]{fill:#E8B23E} [stroke="#d9d2bf"]{stroke:#2c3038} [stroke="#17171A"]{stroke:#EFE8D7} [stroke="#68686D"]{stroke:#9b9ba3} [stroke="#1F4E9B"]{stroke:#5485E0} [stroke="#E0A526"]{stroke:#E8B23E} [stroke="#8B5F10"]{stroke:#E8B23E} }</style>
<rect width="1600" height="900" fill="#F3EFE3"/>

<text x="60" y="62" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" letter-spacing="3.4" fill="#68686D">THE SPINE</text>
<text x="860" y="62" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" letter-spacing="3.4" fill="#68686D">THE CONTRACT</text>

<rect x="60" y="92" width="700" height="724" rx="12" fill="#ECE6D6" stroke="#d9d2bf" stroke-width="2"/>
<g font-family="Menlo,Consolas,monospace" font-size="27" fill="#17171A">
  <text x="96" y="148">kb-demo/</text>
  <text x="96" y="196">├── sources/</text>
  <text x="96" y="244">│   ├── og/</text>
  <text x="96" y="292">│   ├── md/</text>
  <text x="96" y="340">│   ├── unprocessed/</text>
  <text x="96" y="388">│   └── references.bib</text>
  <text x="96" y="436">├── scripts/</text>
  <text x="96" y="484">├── .claude/commands/</text>
  <text x="96" y="532">├── CLAUDE.md</text>
  <text x="96" y="580">├── AGENTS.md</text>
  <text x="96" y="628">└── .gitignore</text>
</g>
<g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26">
  <text x="420" y="244" fill="#68686D">originals, gitignored</text>
  <text x="420" y="292" fill="#1F4E9B">conversions, tracked</text>
  <text x="440" y="340" fill="#68686D">drop zone</text>
  <text x="440" y="388" fill="#8B5F10">one entry per source</text>
  <text x="420" y="436" fill="#68686D">the converter</text>
  <text x="460" y="484" fill="#68686D">intake command</text>
  <text x="420" y="532" fill="#68686D">agent conventions</text>
  <text x="420" y="580" fill="#68686D">link to CLAUDE.md</text>
  <text x="420" y="628" fill="#68686D">keeps og/ out of git</text>
</g>
<text x="96" y="744" font-family="Georgia,serif" font-size="29" font-style="italic" fill="#17171A">Read from md/, never from the PDF.</text>
<text x="96" y="784" font-family="Georgia,serif" font-size="29" font-style="italic" fill="#17171A">Cite from references.bib.</text>

<rect x="860" y="92" width="680" height="110" rx="10" fill="#ECE6D6" stroke="#68686D" stroke-width="3"/>
