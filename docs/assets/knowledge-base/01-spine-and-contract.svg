<rect x="860" y="680" width="680" height="136" rx="10" fill="none" stroke="#68686D" stroke-width="2.5" stroke-dasharray="9 7"/>
<text x="890" y="726" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" letter-spacing="2" fill="#68686D">LOCAL ONLY · THE ORIGINAL</text>
