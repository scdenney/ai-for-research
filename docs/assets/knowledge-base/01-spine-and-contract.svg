<text x="890" y="486" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" letter-spacing="2" fill="#1F4E9B">IN GIT · WHAT THE AGENT READS</text>
<text x="890" y="530" font-family="Menlo,Consolas,monospace" font-size="26" fill="#17171A">sources/md/ferreira-nair-2021-</text>
