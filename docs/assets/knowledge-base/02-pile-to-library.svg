  <rect x="60" y="402" width="660" height="74" rx="8" fill="#ECE6D6" stroke="#d9d2bf" stroke-width="2"/>
  <text x="84" y="448">scan-0417.pdf</text>
</g>

<line x1="735" y1="330" x2="845" y2="330" stroke="#1F4E9B" stroke-width="4" marker-end="url(#a1)"/>
<text x="790" y="302" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" letter-spacing="2" fill="#1F4E9B">INTAKE</text>

<g>
