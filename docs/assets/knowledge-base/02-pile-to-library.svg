<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img" aria-label="The same sources directory shown before and after intake. Before: four unprocessed files under their original download names. After: originals kept, three converted to Markdown and entered in the bibliography, and the fourth file, an image-only scan, still visible and awaiting OCR rather than silently dropped.">
<defs>
  <marker id="a1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#1F4E9B"/>
  </marker>
</defs>
<rect width="1600" height="720" fill="#F3EFE3"/>

<text x="60" y="60" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" letter-spacing="3.4" fill="#68686D">BEFORE</text>
<text x="880" y="60" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" letter-spacing="3.4" fill="#68686D">AFTER INTAKE, BEFORE OCR</text>

<text x="60" y="106" font-family="Menlo,Consolas,monospace" font-size="28" fill="#68686D">sources/unprocessed/</text>

