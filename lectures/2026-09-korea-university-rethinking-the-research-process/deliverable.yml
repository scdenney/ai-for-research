# Deliverable manifest -- read by check_deliverable.py, deliverable-intake, deliverable-lint,
# the SessionStart hook, and /sitrep. Paths are relative to this directory.
schema: 1
agent:                      # vendor-neutral routing; Claude runs /oss:<name>, Codex runs $<name>
  on_braindump: deliverable-intake
  on_review_request: deliverable-lint
  on_session_end: finished
  preserve_raw_captures: true
  session_state: HANDOFF.md
id: afr-korea-university-2026-09-talk
kind: talk
title: "Rethinking the Research Process: How AI Is Changing Research for Students and Professors"
audience: >-
  Korea University, "AI Literacy for Social Scientists" Special Lecture Series, Lecture 01.
  Friday 18 September 2026, 1:30 to 3:30 PM KST, online via Zoom, open to all; graduate students
  and faculty in sociology and political science, moderated by Sung Eun Kim. A 55-minute talk
  followed by moderated discussion. Afterwards, anyone who opens the deck on the AI for
  Research site.
deadline: 2026-09-18
claim: >-
  Automate routine work, protect the practice through which knowledge and judgment develop,
  and collaborate using an inspectable workspace. Build the source library before checking
  claims, distinguish source evidence from derived notes, and retain human responsibility.
done: >-
  Thirty-five main pages including the cover, three part dividers and three mode transitions, plus nine appendix pages in Beamer;
  matching notes budgeted to 55 minutes; all pages rendered and inspected; source excerpts
  verified against original files and historical manuscript changes; pushed to Overleaf.
status: verifiability revision 2026-09-17; to be delivered 2026-09-18
sources_of_truth:
  - overleaf/main.tex
  - notes.md
  - planning/02-rebuild-storyboard.md
published_url: https://scdenney.github.io/ai-for-research/lectures/rethinking-the-research-process/
planning_dir: planning
handoff: HANDOFF.md
sections_from: latex
sections_files: [overleaf/parts/00-open.tex, overleaf/parts/00-foundations.tex, overleaf/parts/01-part1.tex, overleaf/parts/02-part2.tex, overleaf/parts/03-part3.tex, overleaf/parts/04-close.tex]
voice: writing-toolkit@9a7faa7
build:
  command: latexmk -xelatex -interaction=nonstopmode -cd overleaf/main.tex
  artifacts: [overleaf/main.pdf]
checks:
  credentials: true
  prose_tells:
    scan: [notes.md, overleaf/parts/00-open.tex, overleaf/parts/00-foundations.tex, overleaf/parts/01-part1.tex, overleaf/parts/02-part2.tex, overleaf/parts/03-part3.tex, overleaf/parts/04-close.tex]
  deck_budget: false   # budgets for the house deck classes not yet measured; see deck-template README
night_shift:
  enabled: false
  budget_usd: 3
  model: opus
