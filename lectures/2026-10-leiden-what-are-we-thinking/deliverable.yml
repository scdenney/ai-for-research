id: afr-leiden-what-are-we-thinking-2026-10
kind: talk
title: "What Are We Thinking? AI in Research and Supervision"
audience: >-
  Public seminar, Leiden University. Wednesday 21 October 2026, 15:00 to 17:00, DH Lab,
  Huizinga 0.09, in person. Moderator: Aron van de Pol. Researchers and supervisors.
  Slot: 10 min opening survey and published picture, 45 min talk with a live demo, break,
  then discussion from the room's own answers.
deadline: 2026-10-21
claim: >-
  What to shamelessly automate, what to ruthlessly guard from AI, and where to collaborate
  with the machine, applied to research and to supervision, with practical and responsible
  ways to put AI agents to work in both settings.
