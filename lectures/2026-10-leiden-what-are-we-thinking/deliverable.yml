  pages 19-20 and 27, decluttered check, demo background), compiled clean, 0 render flags,
  fourth and fifth review rounds pushed; Overleaf at e1cc875 (web demo URL on 36 and 38); demo now a click-through page at scdenney.github.io/ai-for-research/archive-check, live terminal as backup; Qualtrics survey rebuilt in place with 14 items and the
  same link (version 7), results pipeline updated; no break: results export at page 37;
  survey now one question per page with the author's shorter edit wording; phone test and read of the notes remain.
